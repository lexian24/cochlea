[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cochlea"
version = "0.2.0"
description = "Local-only personalized dictation that adapts to one person"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
zh = ["pypinyin>=0.49"]
acoustic = ["cryptography>=41"]   # encryption at rest for mel features (F7)
# M0's speech recognition (D5). Apple Silicon only -- MLX has no wheel for
# anything else -- which is why it is an extra and why nothing outside
# cochlea.asr may import it at module scope. Invariant 4.
asr = ["mlx-whisper>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
dictate = "cochlea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cochlea = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
