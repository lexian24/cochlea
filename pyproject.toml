[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cochlea"
version = "0.1.0"
description = "Local-only personalized dictation. Core adaptation layers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
zh = ["pypinyin>=0.49"]
acoustic = ["cryptography>=41"]   # encryption at rest for mel features (F7)
dev = ["pytest>=7"]

[project.scripts]
dictate = "cochlea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cochlea = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
