name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,zh,acoustic]"
      - name: Configure a git identity for the importer tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: pytest -q

  text-only:
    # SPEC invariant 4: text-only mode is fully functional at every milestone.
    # The brief names it at M2 and M5 only, so it is enforced here instead of
    # in per-milestone prose. Runs without the optional zh extra as well, so a
    # minimal install is covered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Full suite with no acoustic path and no optional backends
        env:
          COCHLEA_TEXT_ONLY: "1"
        run: pytest -q
      - name: Persona journeys must pass in a minimal install
        run: pytest -q tests/test_journeys.py

  macos-app:
    # Blocking, as of the run where CochleaASRTests first executed: 31 tests,
    # 0 failures. This job was allowed to fail while the Swift was an unproven
    # draft written without a toolchain, which is no longer what it is. Note
    # that XCTest needs full Xcode, so a machine with only Command Line Tools
    # cannot run these locally — this job is the only place they execute.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      # `set -o pipefail` matters: `swift build | tail` returns tail's exit
      # code, so without it a failed build reports success and the job is
      # green while nothing compiles.
      - name: Build
        working-directory: macos
        shell: bash
        run: set -o pipefail && swift build 2>&1 | tail -80
      - name: Test
        working-directory: macos
        shell: bash
        # The passing-test chatter is what fills `tail`, so a failure scrolls
        # off and the log says "1 failure" without naming it -- which happened,
        # and cost a round trip to find a one-line assertion. Dropping the
        # started/passed lines keeps failures, XCTAssert output and the
        # summaries inside the window.
        run: |
          set -o pipefail
          swift test 2>&1 | grep -Ev "' (started|passed) ?\(?" | tail -80
